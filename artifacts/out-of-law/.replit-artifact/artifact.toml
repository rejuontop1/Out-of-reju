kind = "web"
previewPath = "/"
title = "Out of Law"
description = "A faithful rebuild of the user's Out of Law website with matching visual design, navigation, content layout, and interactions."
version = "1.0.0"
id = "artifacts/out-of-law"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20518

[services.development]
run = "pnpm --filter @workspace/out-of-law run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/out-of-law", "run", "build" ]
serve = "static"
publicDir = "artifacts/out-of-law/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20518"
BASE_PATH = "/"
